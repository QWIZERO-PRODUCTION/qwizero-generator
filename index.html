.aur{position:fixed;inset:0;z-index:-1;background:radial-gradient(70% 60% at 0% 0%,var(--g1),transparent 70%),radial-gradient(75% 55% at 100% 105%,var(--g2),transparent 70%),radial-gradient(45% 35% at 70% 100%,var(--g3),transparent 75%),radial-gradient(300px 300px at var(--mx,50%) var(--my,30%),#9fd8ff14,transparent)}

nav b.n{font-size:17px;letter-spacing:.02em}
.sp{flex:1}

nav button.on{background:#ffffff2e}
.sw{width:20px;height:20px;border-radius:50%;padding:0!important;border:2px solid #fff3!important}
.sw.on{border-color:#fff!important;transform:scale(1.15)}
main{max-width:820px;margin:0 auto;padding:6px 20px 60px}
h1{font-size:clamp(28px,5vw,46px);line-height:1.05;letter-spacing:-.025em;text-align:center;margin:4px 0 8px;text-shadow:0 0 30px #08a1ed66}
.sub{text-align:center;color:#c3c7d4;margin:0 0 20px}

.card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;background:linear-gradient(135deg,#fffc,#7cc8ff22 34%,#ffb36b66 58%,#b58cff44 72%,#9be0ffcc);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.grid>.card+.card{margin-top:16px}
#drop{display:flex;align-items:center;gap:14px;min-height:84px;border:1px dashed #ffffff30;border-radius:14px;padding:8px 12px;color:var(--mut);cursor:pointer;transition:.2s;overflow:hidden}
#drop:hover,#drop.ov{border-color:var(--ac);background:#ffffff0a;color:var(--tx)}
#dt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#th{display:none;height:62px;border-radius:9px}
#drop.has #th{display:block}
.chips{display:flex;gap:8px;margin:12px 2px 0}
.chips button{flex:1;background:#ffffff10;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:5px;font:inherit;font-size:13px;cursor:pointer;transition:.15s}
.chips button:hover{background:#ffffff26;transform:translateY(-1px)}
.tune{display:grid;grid-template-columns:1fr 1fr;gap:8px 22px;margin:12px 4px 6px}
.tune label{display:grid;grid-template-columns:1fr auto;font-size:13px;color:var(--mut)}
.tune label input{grid-column:1/-1;width:100%;accent-color:var(--ac)}
.tune output{color:var(--tx)}
.ck{display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center;margin:6px 4px 12px;font-size:13px;color:var(--mut)}
.ck label{display:flex;gap:6px;align-items:center;cursor:pointer}
.ck input{accent-color:var(--ac)}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
select,input[type=text],input[type=number]{background:#ffffff0f;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:7px 9px;font:inherit;font-size:13px}
select option{background:#0a1220}
#cu{width:130px;display:none}
#lim{width:80px}
.pl{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#ffffff0f;color:var(--tx);font-size:18px;cursor:pointer}
#go{width:38px;height:38px;border-radius:50%;border:0;background:linear-gradient(135deg,#fff,#8fd0ff);color:#00152e;box-shadow:0 0 20px #08a1ed88;font-size:19px;font-weight:700;cursor:pointer;margin-left:auto;transition:transform .15s}
#go:hover{transform:scale(1.1)}
.hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
#cnt{font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pb{flex:1;min-width:60px;height:6px;border-radius:3px;background:#ffffff1a;overflow:hidden}
#bar{height:100%;background:var(--ac);transition:width .25s}
.over #bar{background:#ff5470}.over #cnt{color:#ff7a90}
.hd button{background:#ffffff12;border:1px solid var(--line);color:var(--tx);border-radius:9px;padding:5px 11px;font:inherit;font-size:13px;cursor:pointer;transition:.15s}
.hd button:hover{background:#ffffff28}
.hd input[type=range]{width:80px;accent-color:var(--ac)}
#pre{margin:0;overflow:auto;max-height:70vh;background:#020611cc;box-shadow:inset 0 0 0 1px #ffffff14;border-radius:14px;padding:14px;font:9px/1.05 "Cascadia Mono",Consolas,monospace;color:#fff;white-space:pre;text-align:center}
#pre:empty{display:grid;place-items:center;min-height:240px;white-space:normal}
#pre:empty::before{content:attr(data-ph);color:var(--mut);font:14px Bahnschrift,"Segoe UI",sans-serif}
#pre i{font-style:normal}
@media(min-width:1000px){main{max-width:1180px}.grid{display:grid;grid-template-columns:400px 1fr;gap:18px;align-items:start}.grid>.card+.card{margin-top:0}#res{position:sticky;top:14px}#pre{max-height:calc(100vh - 130px)}.tune{grid-template-columns:1fr}}
@media(max-width:560px){.tune{grid-template-columns:1fr}nav{padding:12px 14px;flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

function restore(){try{const o=JSON.parse(store("qs")||"{}");IDS.forEach(i=>{if(i in o){const e=$("#"+i);if(e.type=="checkbox")e.checked=!!o[i];else if(e.tagName!="SELECT"||[...e.options].some(x=>x.value==o[i]))e.value=o[i]}})}catch{}$("#cu").style.display=$("#sym").value=="custom"?"block":"none"}
function vals(){["w","r","l","c","sh"].forEach(k=>$("#o"+k).textContent=$("#"+k).value)}
const cnt=t=>{if(!$("#strict").checked)return t.length;let n=0;for(let i=0;i<t.length;i++)n+=t.charCodeAt(i)>127?2:1;return n};
const E=c=>c=="<"?"&lt;":c=="&"?"&amp;":c;
function setSrc(im){
 if(!im.width||!im.height)throw 0;
 const k=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement("canvas"),x=c.getContext("2d");
 c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
 x.imageSmoothingQuality="high";x.fillStyle="#000";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);src=c;
}
function build(w,p){
 const set=SETS[p.sym],br=set.b,rows=Math.max(1,Math.round(w*src.height/src.width*p.r)),pw=br?w*2:w,ph=br?rows*4:rows,N=pw*ph;
 W.width=pw;W.height=ph;Wx.imageSmoothingQuality="high";Wx.fillStyle="#000";Wx.fillRect(0,0,pw,ph);Wx.drawImage(src,0,0,pw,ph);
 const d=Wx.getImageData(0,0,pw,ph).data,g=new Float32Array(N);
 for(let i=0;i<N;i++)g[i]=(.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2])/255;
 if(p.al){const h=new Uint32Array(256);for(let i=0;i<N;i++)h[(g[i]*255)|0]++;let a=0,lo=0,hi=255;
  for(let i=0;i<256;i++){a+=h[i];if(a>N*.01){lo=i;break}}a=0;for(let i=255;i>=0;i--){a+=h[i];if(a>N*.01){hi=i;break}}
  if(hi-lo>8){const s=255/(hi-lo),o=lo/255;for(let i=0;i<N;i++)g[i]=(g[i]-o)*s}}
 if(p.sh>0&&pw>2&&ph>2){const o=g.slice();for(let y=1;y<ph-1;y++)for(let x=1;x<pw-1;x++){const i=y*pw+x;g[i]=o[i]+p.sh*2*(o[i]-(o[i-1]+o[i+1]+o[i-pw]+o[i+pw]+o[i])/5)}}
 for(let i=0;i<N;i++){const v=Math.min(1,Math.max(0,((g[i]-.5)*p.c+.5)*p.l));g[i]=p.inv?1-v:v}
 const L=[];
 if(br){
  const D=DT[p.dth];
  for(let y=0;y<ph;y++)for(let x=0;x<pw;x++){const i=y*pw+x,o=g[i],n=o>.5?1:0,e=o-n;g[i]=n;
   if(e)for(let j=0;j<D.length;j+=3){const xx=x+D[j],yy=y+D[j+1];if(xx>=0&&xx<pw&&yy<ph)g[yy*pw+xx]+=e*D[j+2]}}
  const B=[1,2,4,64,8,16,32,128];
  for(let r=0;r<rows;r++){const a=[];for(let c=0;c<w;c++){let b=0;for(let dx=0;dx<2;dx++)for(let dy=0;dy<4;dy++)if(g[(r*4+dy)*pw+c*2+dx]>.5)b|=B[dx*4+dy];a.push(0x2800+b)}L.push(String.fromCharCode(...a))}
 }else{
  const c=[...(set.c||$("#cu").value||" .#")],n=c.length;
  for(let r=0;r<rows;r++){let a="";for(let q=0;q<w;q++)a+=c[Math.min(n-1,(g[r*pw+q]*n)|0)];L.push(a)}
 }
 return{t:L.join("\n"),w,h:rows};
}
function colors(w,h){C2.width=w;C2.height=h;C2x.fillStyle="#000";C2x.fillRect(0,0,w,h);C2x.drawImage(src,0,0,w,h);return C2x.getImageData(0,0,w,h).data}
function paint(o){
 const P=$("#pre");
 if(!$("#colr").checked){P.textContent=o.t;return}
 const k=colors(o.w,o.h);let h="",n=0,pc="",run="";
 for(const l of o.t.split("\n")){for(const ch of l){const j=n*4,c=`rgb(${(k[j]>>4)*17},${(k[j+1]>>4)*17},${(k[j+2]>>4)*17})`;
  if(c!==pc){if(run)h+=`<i style="color:${pc}">${run}</i>`;pc=c;run=""}run+=E(ch);n++}run+="\n"}
 P.innerHTML=h+(run?`<i style="color:${pc}">${run}</i>`:"");
}
function fit(){
 if(!out)return;M.font="100px "+FONT;const lw=M.measureText(out.t.split("\n",1)[0]).width/100,P=$("#pre");
 if(!lw)return;const fs=Math.round(Math.min(22,Math.max(3,(P.clientWidth-30)/lw))*2)/2;$("#z").value=fs;P.style.fontSize=fs+"px";
}
function show(anim){
 if(!src)return;
 try{
  const p={r:+$("#r").value,l:+$("#l").value,c:+$("#c").value,sh:+$("#sh").value,inv:$("#inv").checked,al:$("#al").checked,sym:$("#sym").value,dth:$("#dth").value};
  const w=Math.max(10,+$("#w").value||60),lim=+$("#lim").value||1e9;let o=build(w,p);
  if($("#auto").checked&&cnt(o.t)>lim){let lo=6,hi=w,b=6;while(lo<=hi){const m=(lo+hi)>>1;if(cnt(build(m,p).t)<=lim){b=m;lo=m+1}else hi=m-1}o=build(b,p)}
  out=o;paint(o);const n=cnt(o.t),P=$("#pre");
  if(zauto)fit();else P.style.fontSize=$("#z").value+"px";
  $("#cnt").textContent=`${n} / ${lim>1e8?"∞":lim}  ·  ${o.w}×${o.h}`;
  $("#bar").style.width=Math.min(100,n/lim*100)+"%";$("#res").classList.toggle("over",n>lim);
  if(anim)P.animate([{clipPath:"inset(0 0 100% 0)"},{clipPath:"inset(0)"}],{duration:650,easing:"ease-out"});
 }catch(e){console.error(e);msg(T[lang].er)}
}
const go=a=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>show(a))};
const msg=m=>{const t=$("#dt");t.removeAttribute("data-i");t.textContent=m};
function load(f){
 if(!f||!f.type.startsWith("image/"))return;if(f.size>5e7)return msg(T[lang].er);
 const u=URL.createObjectURL(f),im=new Image();
 im.onload=()=>{try{setSrc(im);if(url)URL.revokeObjectURL(url);url=u;$("#th").src=u;$("#drop").classList.add("has");msg(`${f.name} · ${im.width}×${im.height}`);show(1)}catch{msg(T[lang].er)}};
 im.onerror=()=>{URL.revokeObjectURL(u);msg(T[lang].er)};im.src=u;
}
$$(".t").forEach(e=>e.addEventListener("input",()=>{
 if(e.id=="pf"){const[l,s]=e.value.split("|");$("#lim").value=l;$("#strict").checked=s=="1"}
 if(e.id=="sym")$("#cu").style.display=e.value=="custom"?"block":"none";
 vals();save();go(0)}));
$$("[data-p]").forEach(b=>b.onclick=()=>{const p=PRE[b.dataset.p];for(const k in p){const e=$("#"+k);if(e.type=="checkbox")e.checked=!!p[k];else e.value=p[k]}vals();save();go(1)});
$("#z").oninput=e=>{zauto=false;$("#pre").style.fontSize=e.target.value+"px"};
$("#zf").onclick=()=>{zauto=true;fit()};
addEventListener("resize",()=>zauto&&fit());
$("#go").onclick=()=>src?show(1):$("#f").click();
$("#plus").onclick=$("#drop").onclick=()=>$("#f").click();
$("#f").onchange=e=>{load(e.target.files[0]);e.target.value=""};
const dr=$("#drop");
["dragover","dragenter"].forEach(v=>addEventListener(v,e=>{e.preventDefault();dr.classList.add("ov")}));
["dragleave","drop"].forEach(v=>addEventListener(v,()=>dr.classList.remove("ov")));
addEventListener("drop",e=>{e.preventDefault();load(e.dataTransfer.files[0])});
addEventListener("paste",e=>{const f=[...e.clipboardData.files][0];if(f)load(f)});
addEventListener("pointermove",e=>{const s=document.documentElement.style;s.setProperty("--mx",e.clientX+"px");s.setProperty("--my",e.clientY+"px")});
$$("[data-l]").forEach(b=>b.onclick=()=>{lang=b.dataset.l;store("ql",lang);tr()});
$$(".sw").forEach(b=>b.onclick=()=>theme(b.dataset.t));
$("#cp").onclick=async()=>{if(!out)return;try{await navigator.clipboard.writeText(out.t)}catch{const a=document.createElement("textarea");a.value=out.t;document.body.append(a);a.select();document.execCommand("copy");a.remove()}
 const b=$("#cp");b.textContent=T[lang].ok;setTimeout(()=>b.textContent=T[lang].cp,1200)};
const dl=(h,n)=>{const a=document.createElement("a");a.href=h;a.download=n;a.click()};
$("#txt").onclick=()=>out&&dl(URL.createObjectURL(new Blob([out.t],{type:"text/plain"})),"qwizero.txt");
$("#png").onclick=()=>{if(!out)return;const f=12,S=2,L=out.t.split("\n"),inv=$("#inv").checked,col=$("#colr").checked,k=col?colors(out.w,out.h):null,c=document.createElement("canvas"),x=c.getContext("2d"),F=f+"px "+FONT;
 M.font=F;const cw=M.measureText(L[0]).width/out.w;c.width=(Math.ceil(cw*out.w)+40)*S;c.height=(L.length*f+40)*S;x.scale(S,S);
 x.fillStyle=inv?"#fff":"#020611";x.fillRect(0,0,c.width,c.height);x.font=F;x.textBaseline="top";x.fillStyle=inv?"#000":"#fff";
 let n=0;L.forEach((l,r)=>{for(const ch of l){if(k)x.fillStyle=`rgb(${k[n*4]},${k[n*4+1]},${k[n*4+2]})`;x.fillText(ch,20+(n%out.w)*cw,20+r*f);n++}});
 dl(c.toDataURL("image/png"),"qwizero.png")};
lang=store("ql")||"en";theme(store("qt")||"ice");restore();tr();vals();$("#cnt").textContent="0 / "+$("#lim").value;
</script></body></html>
